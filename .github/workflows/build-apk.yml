name: Fast Android APK Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci --legacy-peer-deps

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Compile Standalone Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: Rename and Prepare APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*.apk build-output/tyro-store-management-app.apk
          ls -lh build-output/

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tyro-store-management-apk
          path: build-output/tyro-store-management-app.apk
          retention-days: 14

      - name: Publish Direct Download GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Tyro Store Management APK (Build #${{ github.run_number }})"
          body: |
            ### 📱 Tyro eComm - Store Management App Release
            - **Platform:** Android Standalone APK
            - **Commit:** `${{ github.sha }}`
            - **Build Number:** `${{ github.run_number }}`
            
            ⬇️ **Direct APK Download:** [tyro-store-management-app.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0-${{ github.run_number }}/tyro-store-management-app.apk)
          files: build-output/tyro-store-management-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
